<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">XNET~ Harness</title>
  <desc id="desc">An original dark engineering wordmark for XNET Harness. A cyan and green tilde forms a circuit-like swoosh after XNET. The slogan is Loop Back.</desc>
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b1930"/>
      <stop offset="1" stop-color="#101b2c"/>
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="0.52" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="4" y="4" width="1192" height="252" rx="28" fill="url(#panel)" stroke="#29435f" stroke-width="2"/>
  <path d="M42 198 H1158" fill="none" stroke="#172b42" stroke-width="1"/>
  <path d="M58 58 H292" fill="none" stroke="#1f3a53" stroke-width="2"/>
  <circle cx="58" cy="58" r="4" fill="#67e8f9"/>
  <circle cx="292" cy="58" r="4" fill="#34d399"/>

  <text x="62" y="158" fill="#f8fbff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="112" font-weight="750" letter-spacing="7">XNET</text>

  <path d="M382 81 C430 43 474 121 525 79 C570 43 614 108 661 76"
        fill="none" stroke="#67e8f9" stroke-opacity="0.18" stroke-width="25" stroke-linecap="round" filter="url(#soft)"/>
  <path d="M382 81 C430 43 474 121 525 79 C570 43 614 108 661 76"
        fill="none" stroke="url(#signal)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="382" cy="81" r="8" fill="#67e8f9"/>
  <circle cx="661" cy="76" r="8" fill="#34d399"/>

  <text x="705" y="153" fill="#dce9f6" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="70" font-weight="520" letter-spacing="8">HARNESS</text>
  <text x="710" y="184" fill="#67e8f9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="19" font-weight="750" letter-spacing="5">LOOP BACK!</text>
  <text x="64" y="224" fill="#9fb3c8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" letter-spacing="3.2">SOURCE-GROUNDED CONTEXT  •  DURABLE EVIDENCE  •  BOUNDED EVALUATION</text>
</svg>
