[workspace]
resolver = "2"
members = ["xnet_core", "xnet-fabric", "xnet-runtime", "xnet-sdk", "xnet-cli", "xnet-transport", "crates/*"]
default-members = [
    "xnet-fabric",
    "xnet-runtime",
    "xnet-sdk",
    "xnet-cli",
    "xnet-transport",
    "crates/xnet-hce",
    "crates/xnet-halo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
